openapi: 3.1.0
info:
  title: Store Product Microservice API
  version: 1.0.0
  description: |
    High-performance e-commerce Product Catalog and Variant Management Microservice.
    Powered by Go (Chi router), Supabase PostgreSQL, and Redis caching.
    
    ### Authentication (Gateway Offloading)
    Protected admin mutation endpoints leverage API Gateway Offloading. The API Gateway (`store_gateway`) validates the incoming Bearer JWT and injects verified upstream headers:
    - `X-User-Role`: Required for admin endpoints. Case-insensitive comparison (accepts `admin`, `ADMIN`, etc.).
    - `X-User-Id`: Identifier of the authenticated admin user (e.g. `usr_admin_001`).
    
    ### Rate Limiting
    Public and Admin endpoints enforce Redis sliding window rate limits. Response headers include `X-RateLimit-Limit`, `X-RateLimit-Remaining`, and `X-RateLimit-Reset`.
servers:
  - url: http://localhost:8080
    description: Local Development Server
  - url: /
    description: API Gateway / Current Host

tags:
  - name: Health
    description: Service health probes and liveness checks
  - name: Public Catalog
    description: High-performance public read endpoints with cursor pagination and caching
  - name: Admin Products
    description: Admin mutation endpoints for product management
  - name: Admin Variants
    description: Admin mutation endpoints for product variant management

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health Check Probe
      description: Returns liveness status of the store_product microservice.
      responses:
        "200":
          description: Service is healthy and operational.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/products:
    get:
      tags:
        - Public Catalog
      summary: List Products with Keyset Pagination
      description: |
        Retrieves a paginated list of products with support for multi-attribute filtering (category, price range) and text search.
        Employs keyset cursor pagination for stable O(1) performance.
      parameters:
        - name: cursor
          in: query
          description: Base64-encoded cursor token from previous pageInfo.nextCursor.
          required: false
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of items to return (default 20, max 100).
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: category
          in: query
          description: Filter products by exact category name.
          required: false
          schema:
            type: string
            example: electronics
        - name: min_price
          in: query
          description: Filter products with base price greater than or equal to this amount.
          required: false
          schema:
            type: number
            format: double
            example: 50.00
        - name: max_price
          in: query
          description: Filter products with base price less than or equal to this amount.
          required: false
          schema:
            type: number
            format: double
            example: 200.00
        - name: search
          in: query
          description: Case-insensitive search query matching product name or description.
          required: false
          schema:
            type: string
            example: wireless
      responses:
        "200":
          description: Paginated product list retrieved successfully.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/products/{id}:
    get:
      tags:
        - Public Catalog
      summary: Get Product by ID
      description: |
        Retrieves single product details with all active variants.
        Implements Redis cache-aside (sub-millisecond response on cache hit).
      parameters:
        - name: id
          in: path
          required: true
          description: UUID of the product.
          schema:
            type: string
            format: uuid
            example: ca18f506-7f54-43c8-969f-5861f61b4608
      responses:
        "200":
          description: Product found.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/products/slug/{slug}:
    get:
      tags:
        - Public Catalog
      summary: Get Product by URL Slug
      description: |
        Retrieves product details matching the SEO-friendly slug. Cached in Redis.
      parameters:
        - name: slug
          in: path
          required: true
          description: Unique URL slug of the product.
          schema:
            type: string
            example: logitech-mx-master-3s
      responses:
        "200":
          description: Product found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/admin/products:
    get:
      tags:
        - Admin Products
      summary: List Products for Backoffice (Including Inactive)
      description: |
        Retrieves a paginated list of all products (including draft, inactive, and out-of-stock items) directly from the database.
      security:
        - AdminRoleAuth: []
          AdminUserIdAuth: []
      parameters:
        - name: cursor
          in: query
          description: Keyset cursor token.
          required: false
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of items to return (default 20, max 100).
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: is_active
          in: query
          description: Optional filter by active status.
          required: false
          schema:
            type: boolean
        - name: category
          in: query
          description: Filter products by category.
          required: false
          schema:
            type: string
        - name: search
          in: query
          description: Search by name, description, or variant SKU.
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Paginated product list retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags:
        - Admin Products
      summary: Create Product with Optional Variants
      description: |
        Creates a new product record in Supabase PostgreSQL and invalidates relevant Redis catalog cache keys.
        Requires admin privileges.
      security:
        - AdminRoleAuth: []
          AdminUserIdAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Product created successfully.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/X-RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/admin/products/{id}:
    get:
      tags:
        - Admin Products
      summary: Get Product by ID for Backoffice
      description: |
        Retrieves full product details and all variants (active & inactive) directly from PostgreSQL.
      security:
        - AdminRoleAuth: []
          AdminUserIdAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: UUID of the product.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Product found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      tags:
        - Admin Products
      summary: Update Product Details
      description: |
        Updates an existing product and immediately invalidates detail and catalog Redis caches.
      security:
        - AdminRoleAuth: []
          AdminUserIdAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: UUID of the product to update.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
      responses:
        "200":
          description: Product updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags:
        - Admin Products
      summary: Delete Product (Cascade)
      description: |
        Deletes a product and all its variants from the database and purges corresponding Redis cache keys.
      security:
        - AdminRoleAuth: []
          AdminUserIdAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: UUID of the product to delete.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Product deleted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/admin/products/{id}/variants:
    post:
      tags:
        - Admin Variants
      summary: Create Product Variant
      description: |
        Adds a new SKU variant (size, color, custom price, stock level) to an existing product.
      security:
        - AdminRoleAuth: []
          AdminUserIdAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Parent product UUID.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVariantRequest"
      responses:
        "201":
          description: Variant created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductVariant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/admin/products/{id}/variants/{variantId}:
    put:
      tags:
        - Admin Variants
      summary: Update Product Variant
      description: |
        Modifies pricing, stock, size, color, or status of a specific variant.
      security:
        - AdminRoleAuth: []
          AdminUserIdAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Parent product UUID.
          schema:
            type: string
            format: uuid
        - name: variantId
          in: path
          required: true
          description: Variant UUID to update.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVariantRequest"
      responses:
        "200":
          description: Variant updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductVariant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags:
        - Admin Variants
      summary: Delete Product Variant
      description: |
        Deletes a single variant SKU and refreshes parent product cache.
      security:
        - AdminRoleAuth: []
          AdminUserIdAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Parent product UUID.
          schema:
            type: string
            format: uuid
        - name: variantId
          in: path
          required: true
          description: Variant UUID to delete.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Variant deleted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    AdminRoleAuth:
      type: apiKey
      in: header
      name: X-User-Role
      description: API Gateway-injected role header. Case-insensitive comparison (accepts `admin`, `ADMIN`).
    AdminUserIdAuth:
      type: apiKey
      in: header
      name: X-User-Id
      description: API Gateway-injected user ID (e.g. `usr_admin_001`).

  headers:
    X-RateLimit-Limit:
      description: Request quota allowed per minute window.
      schema:
        type: integer
        example: 120
    X-RateLimit-Remaining:
      description: Remaining quota in the current window.
      schema:
        type: integer
        example: 115
    X-RateLimit-Reset:
      description: Unix epoch timestamp when rate limit quota resets.
      schema:
        type: integer
        example: 1786851642

  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: healthy

    Product:
      type: object
      required:
        - id
        - name
        - slug
        - base_price
        - category
        - is_active
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          example: ca18f506-7f54-43c8-969f-5861f61b4608
        name:
          type: string
          example: Logitech MX Master 3S
        slug:
          type: string
          example: logitech-mx-master-3s
        description:
          type: string
          nullable: true
          example: Performance ergonomic wireless mouse with quiet clicks.
        base_price:
          type: number
          format: double
          example: 99.99
        category:
          type: string
          example: electronics
        is_active:
          type: boolean
          example: true
        variants:
          type: array
          items:
            $ref: "#/components/schemas/ProductVariant"
        created_at:
          type: string
          format: date-time
          example: "2026-08-16T10:30:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-08-16T10:35:00Z"

    ProductVariant:
      type: object
      required:
        - id
        - product_id
        - sku
        - stock
        - is_active
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          example: db2f451f-8465-4151-922f-f94575e0834c
        product_id:
          type: string
          format: uuid
          example: ca18f506-7f54-43c8-969f-5861f61b4608
        sku:
          type: string
          example: MX3S-GRY-001
        size:
          type: string
          nullable: true
          example: Standard
        color:
          type: string
          nullable: true
          example: Graphite
        price:
          type: number
          format: double
          nullable: true
          example: 99.99
        stock:
          type: integer
          example: 50
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateProductRequest:
      type: object
      required:
        - name
        - slug
        - base_price
        - category
      properties:
        name:
          type: string
          example: Logitech MX Master 3S
        slug:
          type: string
          example: logitech-mx-master-3s
        description:
          type: string
          example: Performance ergonomic wireless mouse
        base_price:
          type: number
          format: double
          example: 99.99
        category:
          type: string
          example: electronics
        variants:
          type: array
          items:
            $ref: "#/components/schemas/CreateVariantRequest"

    UpdateProductRequest:
      type: object
      properties:
        name:
          type: string
          example: Logitech MX Master 3S PRO
        description:
          type: string
        base_price:
          type: number
          format: double
          example: 109.99
        category:
          type: string
        is_active:
          type: boolean

    CreateVariantRequest:
      type: object
      required:
        - sku
      properties:
        sku:
          type: string
          example: MX3S-GRY-001
        size:
          type: string
          example: Standard
        color:
          type: string
          example: Graphite
        price:
          type: number
          format: double
          example: 99.99
        stock:
          type: integer
          example: 50

    UpdateVariantRequest:
      type: object
      properties:
        size:
          type: string
        color:
          type: string
        price:
          type: number
          format: double
          example: 104.99
        stock:
          type: integer
          example: 45
        is_active:
          type: boolean

    PageInfo:
      type: object
      required:
        - hasMore
        - nextCursor
      properties:
        hasMore:
          type: boolean
          example: true
        nextCursor:
          type: string
          example: eyJjcmVhdGVkQXQiOiIyMDI2LTA4LTE2VDEwOjAwOjAwWiIsImlkIjoiY2ExOGY1MDYtN2Y1NC00M2M4LTk2OWYtNTg2MWY2MWI0NjA4In0=

    ProductListResponse:
      type: object
      required:
        - items
        - pageInfo
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        pageInfo:
          $ref: "#/components/schemas/PageInfo"

    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          example: forbidden
        message:
          type: string
          example: "Unauthorized access: missing or invalid role"

    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: product deleted successfully

  responses:
    BadRequest:
      description: Invalid request parameters or body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Access forbidden due to missing or non-admin X-User-Role.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Requested product or variant was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Unique constraint violation (duplicate slug or variant SKU).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: An unexpected internal server error occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
